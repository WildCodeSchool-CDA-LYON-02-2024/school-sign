version: '3.8'

services:
  db:
    image: mysql:8
    container_name: school-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: school_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql

  app:
    build: .
    container_name: school-api
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: mysql://admin:admin@db:3306/school_db
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    command: ["sh", "-c", "npx prisma migrate deploy && npm run start"]

volumes:
  mysqldata:
